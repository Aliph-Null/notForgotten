<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: flex-start;
      }
      video {
        width: 100%;
        height: 83vh;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <video id="v" src="final.webm" playsinline></video>
    <script>
      const v = document.getElementById("v");
      document.body.onclick = () => (v.paused ? v.play() : v.pause());
      window.onblur = () => {
        v.pause();
      };
      window.onfocus = () => {
        v.currentTime = 0;
        v.pause();
      };
    </script>
  </body>
</html>
