<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voyager 1 – Idle</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0629; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }

  /* ---------- idle motion ---------- */
  .float  { transform-origin: 500px 450px; animation: float 7s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translate(0, 6px) rotate(.6deg); }
    50%      { transform: translate(8px, -14px) rotate(-.8deg); }
  }
  .boom   { transform-origin: 510px 500px; animation: boom 6s ease-in-out infinite; }
  @keyframes boom { 0%,100% { transform: rotate(-.5deg); } 50% { transform: rotate(.7deg); } }

  .wire1  { transform-origin: 395px 498px; animation: wire 5s ease-in-out infinite; }
  .wire2  { transform-origin: 385px 540px; animation: wire 4.3s ease-in-out infinite reverse; }
  @keyframes wire { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(1deg); } }

  .sci    { transform-origin: 400px 310px; animation: sci 9s ease-in-out infinite; }
  @keyframes sci { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(3deg); } }

  .dish   { transform-origin: 478px 418px; animation: dish 8s ease-in-out infinite; }
  @keyframes dish { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.2deg); } }

  .pulse  { transform-origin: 0 0; opacity: 0; animation: pulse 4.5s ease-out infinite; }
  @keyframes pulse {
    0%   { transform: scale(.5); opacity: 0; }
    15%  { opacity: .9; }
    100% { transform: scale(6.5); opacity: 0; }
  }
  .glint  { animation: glint 5s ease-in-out infinite; }
  @keyframes glint { 0%,100% { opacity: .15; } 50% { opacity: .75; } }
  .blink  { animation: blink 2.6s steps(1) infinite; }
  @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: .15; } }

  /* ---------- background motion ---------- */
  .drift1 { animation: drift 260s linear infinite; }
  .drift2 { animation: drift 170s linear infinite; }
  .drift3 { animation: drift 110s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(1280px); } }
  .tw     { animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .neb1   { animation: neb 22s ease-in-out infinite; }
  .neb2   { animation: neb 30s ease-in-out infinite reverse; }
  @keyframes neb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-24px, 18px); } }
  .dust   { animation: dust linear infinite; opacity: 0; }
  @keyframes dust {
    0%   { transform: translate(0,0); opacity: 0; }
    20%  { opacity: .55; }
    100% { transform: translate(70px,-90px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<svg viewBox="0 0 1280 1060" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0c44"/>
      <stop offset=".55" stop-color="#120a36"/>
      <stop offset="1" stop-color="#0a0626"/>
    </linearGradient>
    <linearGradient id="nebA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6cf0"/>
      <stop offset="1" stop-color="#3a2fc0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb35a" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#8a4fe0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8a4fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dishFace" cx=".38" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#ece8ff"/>
      <stop offset="1" stop-color="#c9c1f0"/>
    </radialGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#f0a93a"/>
    </linearGradient>
    <linearGradient id="goldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaa030"/><stop offset="1" stop-color="#c47a22"/>
    </linearGradient>
    <linearGradient id="rtg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4478"/><stop offset=".6" stop-color="#6d68a4"/><stop offset="1" stop-color="#8d88c4"/>
    </linearGradient>
    <filter id="blur45" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="blur20" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1280" height="1060" fill="url(#bg)"/>

  <g class="neb1" filter="url(#blur45)" opacity=".75">
    <path d="M820 -50 C1000 150 1080 300 900 420 C760 520 800 640 640 760 C540 840 560 960 480 1110 L280 1110 C360 900 520 820 560 700 C600 560 700 470 720 360 C740 240 700 100 700 -50 Z" fill="url(#nebA)"/>
  </g>
  <g class="neb2" filter="url(#blur45)" opacity=".45">
    <path d="M880 120 C1000 220 980 360 860 460 C760 540 740 680 650 800 C610 860 590 940 560 1040 L640 1040 C700 900 800 780 860 640 C920 500 1060 420 1000 260 Z" fill="#8a4fe0"/>
  </g>
  <ellipse cx="460" cy="440" rx="420" ry="360" fill="url(#halo)" filter="url(#blur20)"/>

  <g id="starsFar" class="drift1"><g id="sf1"></g><g id="sf2" transform="translate(-1280 0)"></g></g>
  <g id="starsMid" class="drift2"><g id="sm1"></g><g id="sm2" transform="translate(-1280 0)"></g></g>
  <g id="starsNear" class="drift3"><g id="sn1"></g><g id="sn2" transform="translate(-1280 0)"></g></g>
  <g id="dustLayer"></g>

  <!-- ===== VOYAGER 1 ===== -->
  <g class="float">

    <!-- radio waves toward Earth -->
    <g transform="translate(540 418) rotate(-8)">
      <path class="pulse" style="animation-delay:0s"   d="M32.8 -22.9 A40 40 0 0 1 32.8 22.9" fill="none" stroke="#7ee7ff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path class="pulse" style="animation-delay:1.5s" d="M32.8 -22.9 A40 40 0 0 1 32.8 22.9" fill="none" stroke="#7ee7ff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path class="pulse" style="animation-delay:3s"   d="M32.8 -22.9 A40 40 0 0 1 32.8 22.9" fill="none" stroke="#7ee7ff" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- magnetometer boom -->
    <g class="boom">
      <g transform="translate(510 500) rotate(29.7)">
        <g id="boomTruss"></g>
        <rect x="347" y="-8" width="9" height="16" rx="2" fill="#f4e3b0"/>
        <rect x="604" y="-7" width="20" height="14" rx="3" fill="#f4e3b0"/>
        <rect x="614" y="-7" width="10" height="14" rx="3" fill="#cdb67a"/>
      </g>
    </g>

    <!-- long wire antennas -->
    <g class="wire1"><line x1="395" y1="498" x2="170" y2="843" stroke="#f5d98a" stroke-width="2.4" stroke-linecap="round"/></g>
    <g class="wire2"><line x1="385" y1="540" x2="335" y2="703" stroke="#f5d98a" stroke-width="2.4" stroke-linecap="round"/></g>

    <!-- RTG boom -->
    <g>
      <g id="rtgTruss"></g>
      <rect x="396" y="505" width="30" height="84" rx="7" fill="url(#rtg)"/>
      <rect x="396" y="527" width="30" height="3" fill="#2f2a58" opacity=".7"/>
      <rect x="396" y="549" width="30" height="3" fill="#2f2a58" opacity=".7"/>
      <rect x="396" y="571" width="30" height="3" fill="#2f2a58" opacity=".7"/>
      <rect x="418" y="509" width="5" height="76" rx="2.5" fill="#b3aee6" opacity=".45"/>
    </g>

    <!-- spacecraft bus -->
    <g>
      <!-- left flap + struts -->
      <path d="M288 362 L332 352 L342 388 L290 396 Z" fill="#d9902b"/>
      <path d="M288 362 L332 352 L334 360 L290 370 Z" fill="#ffd978"/>
      <path d="M290 441 L338 431 M290 446 L332 472 M290 441 L290 446" stroke="#f1b84e" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- body faces -->
      <path d="M330 365 L392 350 L424 374 L365 388 Z" fill="url(#goldTop)"/>
      <path d="M330 365 L365 388 L365 488 L335 470 Z" fill="#b8731f"/>
      <path d="M365 388 L424 374 L424 482 L384 496 L365 488 Z" fill="url(#goldFront)"/>
      <!-- louver panel -->
      <path d="M338 405 L362 411 L362 470 L338 458 Z" fill="#3d2a52"/>
      <g stroke="#8a6a3a" stroke-width="1.5" opacity=".8">
        <line x1="338" y1="415" x2="362" y2="421"/><line x1="338" y1="425" x2="362" y2="431"/>
        <line x1="338" y1="435" x2="362" y2="441"/><line x1="338" y1="445" x2="362" y2="451"/>
        <line x1="338" y1="455" x2="362" y2="461"/>
      </g>
      <!-- front highlight edge -->
      <path d="M365 388 L424 374" stroke="#ffe7a8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- science boom + scan platform -->
    <g class="sci">
      <g id="sciTruss"></g>
      <line x1="410" y1="286" x2="335" y2="246" stroke="#e8a83a" stroke-width="12" stroke-linecap="round"/>
      <g>
        <path d="M278 232 L296 210 L335 214 L350 238 L322 262 L290 256 Z" fill="#e7a73a"/>
        <path d="M290 256 L322 262 L350 238 L346 252 L322 276 L292 270 Z" fill="#b8741f"/>
        <path d="M296 210 L335 214 L338 220 L298 217 Z" fill="#ffd978"/>
        <circle cx="300" cy="234" r="9" fill="#3a2a5c"/>
        <circle cx="300" cy="234" r="9" fill="none" stroke="#f6d27c" stroke-width="2.5"/>
        <circle cx="297" cy="231" r="2.4" fill="#fff" opacity=".8"/>
        <rect x="318" y="260" width="20" height="34" rx="6" fill="#e0952c"/>
        <rect x="338" y="264" width="18" height="30" rx="5" fill="#c97a24"/>
        <ellipse cx="328" cy="292" rx="7" ry="3.5" fill="#3a2a5c"/>
        <ellipse cx="347" cy="292" rx="6" ry="3" fill="#3a2a5c"/>
      </g>
      <rect x="396" y="262" width="34" height="44" rx="7" fill="#e8b04a"/>
      <rect x="420" y="266" width="10" height="36" rx="4" fill="#b8741f"/>
      <rect x="400" y="266" width="8" height="30" rx="3" fill="#ffd978" opacity=".8"/>
    </g>

    <!-- high-gain antenna -->
    <g class="dish">
      <g transform="translate(478 418) rotate(8)">
        <ellipse cx="-16" cy="0" rx="56" ry="132" fill="#4a3f8f"/>
        <ellipse cx="0" cy="0" rx="58" ry="134" fill="#ffffff"/>
        <ellipse cx="0" cy="0" rx="52" ry="127" fill="url(#dishFace)"/>
        <ellipse cx="-8" cy="6" rx="38" ry="104" fill="#8f82d6" opacity=".13"/>
        <path d="M-28 -118 C-8 -122 20 -100 30 -60" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
        <ellipse class="glint" cx="22" cy="-70" rx="5" ry="18" fill="#fff" transform="rotate(10 22 -70)"/>
        <!-- hub + struts -->
        <g stroke="#cfc9ee" stroke-width="2.2" stroke-linecap="round">
          <line x1="-10" y1="-52" x2="62" y2="-1"/>
          <line x1="-10" y1="50" x2="62" y2="1"/>
          <line x1="-33" y1="0" x2="62" y2="0"/>
        </g>
        <rect x="-50" y="-9" width="32" height="18" rx="5" fill="#8f8ac8"/>
        <ellipse cx="-33" cy="0" rx="14" ry="9" fill="#d5d9ee"/>
        <ellipse cx="-33" cy="0" rx="6" ry="4.5" fill="#2a2260"/>
        <!-- feed horn -->
        <path d="M54 -6 L71 -2.5 L71 2.5 L54 6 Z" fill="#a39fd0"/>
        <circle cx="72" cy="0" r="3" fill="#e9e5ff"/>
        <circle class="blink" cx="72" cy="0" r="1.6" fill="#7ee7ff"/>
      </g>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1280" height="1060" fill="none" stroke="#06031a" stroke-width="0"/>
</svg>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const $ = id => document.getElementById(id);

  // seeded random so the sky is stable
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  /* ---------- lattice truss generator ---------- */
  function truss(target, x1, y1, x2, y2, w, seg, rail, sw) {
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, nx = -uy * w / 2, ny = ux * w / 2;
    const n = Math.max(2, Math.round(len / seg));
    let d = `M${x1 + nx} ${y1 + ny} L${x2 + nx} ${y2 + ny} M${x1 - nx} ${y1 - ny} L${x2 - nx} ${y2 - ny}`;
    for (let i = 0; i < n; i++) {
      const a = i / n, b = (i + 1) / n;
      const ax = x1 + dx * a, ay = y1 + dy * a, bx = x1 + dx * b, by = y1 + dy * b;
      const s = i % 2 ? 1 : -1;
      d += ` M${ax + nx * s} ${ay + ny * s} L${bx - nx * s} ${by - ny * s}`;
      d += ` M${bx + nx} ${by + ny} L${bx - nx} ${by - ny}`;
    }
    el("path", { d, fill: "none", stroke: rail, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round" }, target);
  }
  truss($("boomTruss"), 0, 0, 616, 0, 12, 26, "#ecc66b", 2.4);
  truss($("sciTruss"), 385, 352, 412, 292, 14, 14, "#e8a83a", 2.6);
  truss($("rtgTruss"), 385, 492, 410, 508, 12, 10, "#e8a83a", 2.4);

  /* ---------- stars ---------- */
  const cols = ["#ffffff", "#cfd8ff", "#9db4ff", "#ffe1b0"];
  function stars(idA, idB, n, rMin, rMax, twinkleChance) {
    for (let i = 0; i < n; i++) {
      const x = rnd() * 1280, y = rnd() * 1060, r = rMin + rnd() * (rMax - rMin);
      const c = cols[Math.floor(rnd() * cols.length)], o = .45 + rnd() * .55;
      const tw = rnd() < twinkleChance, delay = (rnd() * 4).toFixed(2) + "s", dur = (3 + rnd() * 3).toFixed(1) + "s";
      [idA, idB].forEach(id => {
        const a = { cx: x, cy: y, r, fill: c, opacity: o };
        if (tw) { a.class = "tw"; a.style = `animation-delay:${delay};animation-duration:${dur}`; }
        el("circle", a, $(id));
      });
    }
  }
  stars("sf1", "sf2", 90, .6, 1.2, .3);
  stars("sm1", "sm2", 45, 1.1, 1.9, .5);

  // bigger glowing blue stars (like the reference)
  for (let i = 0; i < 9; i++) {
    const x = rnd() * 1280, y = rnd() * 1060;
    ["sn1", "sn2"].forEach(id => {
      el("circle", { cx: x, cy: y, r: 6, fill: "#6d8dff", opacity: .55, filter: "url(#glow)" }, $(id));
      el("circle", { cx: x, cy: y, r: 2.6, fill: "#bcd0ff" }, $(id));
    });
  }

  /* ---------- floating dust ---------- */
  for (let i = 0; i < 26; i++) {
    el("circle", {
      cx: rnd() * 1280, cy: rnd() * 1060, r: 1.2 + rnd() * 2.2,
      fill: rnd() < .5 ? "#b9a6ff" : "#ffd9a0", class: "dust",
      style: `animation-duration:${(9 + rnd() * 10).toFixed(1)}s;animation-delay:${(-rnd() * 15).toFixed(1)}s`
    }, $("dustLayer"));
  }
})();
</script>
</body>
</html>
