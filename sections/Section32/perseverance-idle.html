<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perseverance – Idle on Mars</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#2a1418; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #dust  { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #vig   { position:fixed; inset:0; pointer-events:none;
           background: radial-gradient(ellipse at 52% 55%, rgba(0,0,0,0) 52%, rgba(38,10,26,.55) 100%); }
  #grain { position:fixed; inset:0; pointer-events:none; opacity:.28; mix-blend-mode:overlay; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Martian sky: dusty butterscotch, darker/mauve overhead -->
  <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="670">
    <stop offset="0"   stop-color="#4f3650"/>
    <stop offset=".22" stop-color="#855563"/>
    <stop offset=".48" stop-color="#c0866a"/>
    <stop offset=".75" stop-color="#e3ac80"/>
    <stop offset="1"   stop-color="#f3cca2"/>
  </linearGradient>
  <!-- the famous blue sunset glow around the Martian sun (forward scattering by fine dust) -->
  <radialGradient id="gHalo">
    <stop offset="0"   stop-color="#e4f1ff" stop-opacity="1"/>
    <stop offset=".07" stop-color="#bcdcff" stop-opacity=".95"/>
    <stop offset=".22" stop-color="#8fbdf0" stop-opacity=".55"/>
    <stop offset=".48" stop-color="#8f98cf" stop-opacity=".22"/>
    <stop offset="1"   stop-color="#8c78a8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gSunGlow">
    <stop offset="0"  stop-color="#ffffff" stop-opacity="1"/>
    <stop offset=".35" stop-color="#e3f1ff" stop-opacity=".9"/>
    <stop offset="1"  stop-color="#bcdcff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2c79c" stop-opacity="0"/>
    <stop offset="1" stop-color="#f2c79c" stop-opacity=".62"/>
  </linearGradient>
  <linearGradient id="gHaze2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8b58d" stop-opacity="0"/>
    <stop offset="1" stop-color="#e8b58d" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bf8a78"/>
    <stop offset="1" stop-color="#d9a585"/>
  </linearGradient>
  <linearGradient id="gMid" gradientUnits="userSpaceOnUse" x1="0" y1="655" x2="0" y2="720">
    <stop offset="0" stop-color="#b98169"/>
    <stop offset="1" stop-color="#9b6650"/>
  </linearGradient>
  <linearGradient id="gGround" gradientUnits="userSpaceOnUse" x1="0" y1="719" x2="0" y2="1080">
    <stop offset="0"   stop-color="#9b6650"/>
    <stop offset=".35" stop-color="#87533f"/>
    <stop offset="1"   stop-color="#5a3030"/>
  </linearGradient>
  <radialGradient id="gSunPatch" gradientUnits="userSpaceOnUse" cx="1450" cy="780" r="780">
    <stop offset="0" stop-color="#ffd2a0" stop-opacity=".34"/>
    <stop offset="1" stop-color="#ffd2a0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gCloud" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"  stop-color="#efe4f2" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f1e8f4" stop-opacity=".2"/>
    <stop offset="1"  stop-color="#efe4f2" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gPhobos" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6b4a52"/>
    <stop offset="1" stop-color="#d0aa95"/>
  </linearGradient>

  <!-- rover materials (cool shadow side, warm lit side) -->
  <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cbb9bc"/><stop offset=".55" stop-color="#eee4d9"/><stop offset="1" stop-color="#fff1de"/>
  </linearGradient>
  <linearGradient id="gMetalDark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b7a82"/><stop offset="1" stop-color="#c4ae9f"/>
  </linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c58b38"/><stop offset=".6" stop-color="#f1c264"/><stop offset="1" stop-color="#ffdf94"/>
  </linearGradient>
  <linearGradient id="gSilver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff4e4"/><stop offset=".5" stop-color="#dfe0e6"/><stop offset="1" stop-color="#9d9fb0"/>
  </linearGradient>
  <radialGradient id="gLens">
    <stop offset="0" stop-color="#4d8c86"/><stop offset=".55" stop-color="#1f3338"/><stop offset="1" stop-color="#12191e"/>
  </radialGradient>
  <radialGradient id="gWheel">
    <stop offset="0" stop-color="#9a94a1"/><stop offset="1" stop-color="#5a5666"/>
  </radialGradient>
  <radialGradient id="gSpark">
    <stop offset="0" stop-color="#fff3c8" stop-opacity="1"/>
    <stop offset=".4" stop-color="#ffb4d8" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ff9ccd" stop-opacity="0"/>
  </radialGradient>

  <g id="wheel">
    <circle r="52" fill="#2d2a35"/>
    <circle r="48.5" fill="none" stroke="#14121a" stroke-width="7" stroke-dasharray="4.5 4.5"/>
    <circle r="43" fill="url(#gWheel)"/>
    <circle r="34" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3"/>
    <g fill="none" stroke="#e4ac3f" stroke-width="3.6" stroke-linecap="round">
      <path d="M0,0 Q12,-14 8,-33"/>
      <path d="M0,0 Q12,-14 8,-33" transform="rotate(60)"/>
      <path d="M0,0 Q12,-14 8,-33" transform="rotate(120)"/>
      <path d="M0,0 Q12,-14 8,-33" transform="rotate(180)"/>
      <path d="M0,0 Q12,-14 8,-33" transform="rotate(240)"/>
      <path d="M0,0 Q12,-14 8,-33" transform="rotate(300)"/>
    </g>
    <circle r="11" fill="#e8e2d8"/><circle r="4.5" fill="#5a5560"/>
    <path d="M26,-40 A48,48 0 0 1 46,-14" fill="none" stroke="#ffe8c4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>
</defs>

<!-- ============ SKY ============ -->
<rect width="1920" height="700" fill="url(#gSky)"/>

<!-- thin water-ice cirrus -->
<g id="clouds">
  <g id="cloud1"><ellipse cx="420"  cy="215" rx="300" ry="9"  fill="url(#gCloud)"/><ellipse cx="520" cy="240" rx="200" ry="6" fill="url(#gCloud)"/></g>
  <g id="cloud2"><ellipse cx="1180" cy="150" rx="340" ry="10" fill="url(#gCloud)"/><ellipse cx="1060" cy="178" rx="210" ry="6" fill="url(#gCloud)"/></g>
  <g id="cloud3"><ellipse cx="1650" cy="300" rx="260" ry="8"  fill="url(#gCloud)"/></g>
  <g id="cloud4"><ellipse cx="760"  cy="330" rx="230" ry="6"  fill="url(#gCloud)"/></g>
</g>

<!-- sun with blue halo -->
<g transform="translate(1500 520)">
  <g id="haloPulse"><circle r="600" fill="url(#gHalo)"/></g>
  <circle r="74" fill="url(#gSunGlow)"/>
  <circle r="21" fill="#fbfdff"/>
</g>

<!-- Phobos, drifting across -->
<g id="phobos">
  <g transform="scale(.7)">
    <path d="M-18,-4 C-16,-13 -2,-16 10,-12 C20,-9 24,2 15,9 C6,15 -10,14 -17,6 C-21,3 -19,-1 -18,-4Z" fill="url(#gPhobos)"/>
    <circle cx="-7" cy="1" r="5.5" fill="rgba(50,28,36,.38)"/>
    <circle cx="8"  cy="-4" r="2.4" fill="rgba(50,28,36,.3)"/>
    <circle cx="5"  cy="6" r="1.8" fill="rgba(50,28,36,.3)"/>
  </g>
</g>

<!-- warm horizon glow -->
<rect y="500" width="1920" height="170" fill="url(#gHaze)"/>

<!-- ============ FAR CRATER RIM (Jezero-style mesas) ============ -->
<path d="M0,650 L0,612 L150,598 L262,602 L304,580 L520,576 L562,592 L760,598 L900,588 L962,562 L1180,558 L1232,577 L1400,592 L1560,586 L1620,568 L1840,570 L1920,592 L1920,650 Z" fill="url(#gFar)"/>
<path d="M962,562 L1180,558 L1232,577 L1180,583 L970,580 Z" fill="rgba(110,60,70,.18)"/>
<path d="M304,580 L520,576 L562,592 L310,590 Z" fill="rgba(110,60,70,.15)"/>
<circle cx="1500" cy="520" r="560" fill="url(#gHalo)" opacity=".28"/>
<rect y="560" width="1920" height="130" fill="url(#gHaze2)"/>

<!-- ============ MID HILLS ============ -->
<path d="M0,722 L0,692 C140,668 300,668 460,684 C640,702 760,676 960,664 C1180,652 1340,676 1540,670 C1700,664 1820,676 1920,692 L1920,722 Z" fill="url(#gMid)"/>

<!-- dust devil -->
<g id="devilDrift"><g id="devil" transform="translate(380 0)"></g></g>

<!-- ============ GROUND ============ -->
<rect y="719" width="1920" height="361" fill="url(#gGround)"/>
<rect y="719" width="1920" height="361" fill="url(#gSunPatch)"/>
<rect y="640" width="1920" height="100" fill="url(#gHaze2)"/>
<g id="ripples" fill="none" stroke-linecap="round"></g>
<g id="pebbles"></g>
<g id="rocks"></g>
<g id="heroRock"></g>

<!-- ============ ROVER SHADOW (long, low sun) ============ -->
<g transform="translate(620 930) scale(.95)">
  <g transform="matrix(1 0 1.1 -0.2 0 0)" fill="rgba(42,16,30,.4)">
    <rect x="130" y="-335" width="356" height="140" rx="16"/>
    <rect x="293" y="-540" width="18" height="206"/>
    <rect x="252" y="-604" width="100" height="66" rx="14"/>
    <circle cx="70" cy="-52" r="52"/><circle cx="270" cy="-52" r="52"/><circle cx="470" cy="-52" r="52"/>
    <path d="M62,-52 L190,-135 L330,-188 L470,-52 L440,-52 L330,-150 L200,-90 L100,-52Z"/>
    <polygon points="8,-306 140,-268 140,-232 4,-262"/>
    <path d="M482,-228 L548,-186 L616,-146 L660,-146 L660,-150 L616,-182 L548,-210Z"/>
    <rect x="176" y="-392" width="40" height="60" rx="14"/>
    <rect x="396" y="-398" width="8" height="64"/><polygon points="356,-398 378,-411 422,-411 444,-398 422,-385 378,-385"/>
  </g>
</g>

<!-- ============ PERSEVERANCE ============ -->
<g id="rover" transform="translate(620 930) scale(.95)">
  <!-- wheel contact shadows -->
  <ellipse cx="70"  cy="2" rx="60" ry="9" fill="rgba(40,14,26,.55)"/>
  <ellipse cx="270" cy="2" rx="60" ry="9" fill="rgba(40,14,26,.55)"/>
  <ellipse cx="470" cy="2" rx="60" ry="9" fill="rgba(40,14,26,.55)"/>

  <!-- far-side wheels -->
  <g>
    <use href="#wheel" x="94"  y="-66"/><circle cx="94"  cy="-66" r="52" fill="rgba(52,26,52,.42)"/>
    <use href="#wheel" x="294" y="-66"/><circle cx="294" cy="-66" r="52" fill="rgba(52,26,52,.42)"/>
    <use href="#wheel" x="494" y="-66"/><circle cx="494" cy="-66" r="52" fill="rgba(52,26,52,.42)"/>
  </g>

  <!-- rocker-bogie suspension -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470,-52 L400,-140 L330,-188 L190,-135" stroke="#6f5f6c" stroke-width="22"/>
    <path d="M70,-52 L190,-135 L270,-52" stroke="#6f5f6c" stroke-width="22"/>
    <path d="M470,-52 L400,-140 L330,-188 L190,-135" stroke="#d3c6c3" stroke-width="14"/>
    <path d="M70,-52 L190,-135 L270,-52" stroke="#d3c6c3" stroke-width="14"/>
    <path d="M400,-140 L330,-188 L190,-135" stroke="#fff0dc" stroke-width="3" opacity=".6" transform="translate(3 -3)"/>
  </g>
  <circle cx="190" cy="-135" r="14" fill="#7d6f7b"/><circle cx="190" cy="-135" r="7" fill="#e9dccf"/>
  <circle cx="330" cy="-188" r="12" fill="#7d6f7b"/><circle cx="330" cy="-188" r="6" fill="#e9dccf"/>

  <!-- near-side wheels -->
  <use href="#wheel" x="70"  y="-52"/>
  <use href="#wheel" x="270" y="-52"/>
  <use href="#wheel" x="470" y="-52"/>

  <!-- body (breathes a little) -->
  <g id="body">
    <!-- RTG -->
    <g transform="translate(140 -262) rotate(9)">
      <rect x="-132" y="-30" width="132" height="60" rx="12" fill="url(#gSilver)"/>
      <g fill="#3b3640">
        <rect x="-120" y="-44" width="8" height="88" rx="2"/><rect x="-104" y="-44" width="8" height="88" rx="2"/>
        <rect x="-88"  y="-44" width="8" height="88" rx="2"/><rect x="-72"  y="-44" width="8" height="88" rx="2"/>
        <rect x="-56"  y="-44" width="8" height="88" rx="2"/><rect x="-40"  y="-44" width="8" height="88" rx="2"/>
        <rect x="-24"  y="-44" width="8" height="88" rx="2"/>
      </g>
      <g fill="rgba(255,226,190,.55)">
        <rect x="-115" y="-44" width="2.5" height="88"/><rect x="-99" y="-44" width="2.5" height="88"/>
        <rect x="-83"  y="-44" width="2.5" height="88"/><rect x="-67" y="-44" width="2.5" height="88"/>
        <rect x="-51"  y="-44" width="2.5" height="88"/><rect x="-35" y="-44" width="2.5" height="88"/>
        <rect x="-19"  y="-44" width="2.5" height="88"/>
      </g>
      <rect x="-132" y="-30" width="132" height="10" rx="5" fill="rgba(255,255,255,.35)"/>
    </g>

    <!-- chassis -->
    <rect x="130" y="-335" width="356" height="140" rx="16" fill="url(#gMetal)"/>
    <rect x="130" y="-222" width="356" height="27" rx="12" fill="url(#gMetalDark)"/>
    <rect x="146" y="-346" width="170" height="16" rx="7" fill="url(#gGold)"/>
    <rect x="140" y="-318" width="78" height="92" rx="12" fill="url(#gGold)" opacity=".92"/>
    <g stroke="rgba(255,240,200,.55)" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M150,-300 l32,-8"/><path d="M158,-282 l44,10"/><path d="M150,-262 l30,-7"/><path d="M170,-244 l36,8"/>
    </g>
    <path d="M240,-335 V-224 M426,-335 V-224" stroke="rgba(60,30,50,.14)" stroke-width="2"/>
    <rect x="300" y="-300" width="120" height="64" rx="10" fill="#4d4b57"/>
    <g fill="#6c6978">
      <rect x="308" y="-292" width="8" height="48" rx="3"/><rect x="326" y="-292" width="8" height="48" rx="3"/>
      <rect x="344" y="-292" width="8" height="48" rx="3"/><rect x="362" y="-292" width="8" height="48" rx="3"/>
      <rect x="380" y="-292" width="8" height="48" rx="3"/><rect x="398" y="-292" width="8" height="48" rx="3"/>
    </g>
    <rect x="482" y="-324" width="4" height="118" rx="2" fill="#fff3d8" opacity=".75"/>

    <!-- status LED -->
    <circle cx="456" cy="-318" r="9" fill="rgba(141,255,208,.25)"/>
    <circle id="led" cx="456" cy="-318" r="3.6" fill="#8dffd0"/>

    <!-- deck gear -->
    <rect x="176" y="-392" width="40" height="62" rx="14" fill="url(#gSilver)"/>
    <ellipse cx="196" cy="-390" rx="18" ry="6" fill="#f6efe6"/>
    <rect x="222" y="-372" width="12" height="42" rx="4" fill="#4a4650"/>
    <rect x="252" y="-372" width="9"  height="40" rx="3" fill="#3c3f48"/>
    <circle cx="256.5" cy="-372" r="6" fill="#d9d3c9"/>
    <rect x="330" y="-362" width="44" height="28" rx="6" fill="url(#gMetal)"/>
    <rect x="382" y="-352" width="30" height="18" rx="5" fill="url(#gGold)"/>

    <!-- high-gain antenna -->
    <g id="hga">
      <rect x="396" y="-392" width="8" height="60" fill="#7a7580"/>
      <g transform="translate(400 -398) rotate(-18)">
        <polygon points="-44,0 -22,-13 22,-13 44,0 22,13 -22,13" fill="#e7e3de" stroke="#d8a647" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="-30,0 -15,-8 15,-8 30,0 15,8 -15,8" fill="#bdb7b3"/>
      </g>
    </g>

    <!-- mast + MEDA booms -->
    <rect x="284" y="-346" width="36" height="14" rx="5" fill="url(#gMetalDark)"/>
    <rect x="293" y="-470" width="18" height="130" fill="url(#gMetal)"/>
    <rect x="289" y="-476" width="26" height="9" rx="3" fill="url(#gGold)"/>
    <rect x="296" y="-540" width="12" height="68" fill="url(#gMetal)"/>
    <rect x="311" y="-440" width="44" height="6" rx="3" fill="#ddd6cc"/><circle cx="355" cy="-437" r="5" fill="#3b3f48"/>
    <rect x="250" y="-455" width="42" height="6" rx="3" fill="#ddd6cc"/><circle cx="250" cy="-452" r="5" fill="#3b3f48"/>

    <!-- head: Mastcam-Z + SuperCam -->
    <g id="head">
      <rect x="252" y="-604" width="100" height="66" rx="14" fill="url(#gMetal)"/>
      <rect x="262" y="-610" width="80" height="10" rx="5" fill="#f7f0e5"/>
      <rect x="258" y="-580" width="9" height="30" rx="3" fill="#5b5760"/>
      <rect x="348" y="-598" width="3" height="54" rx="1.5" fill="#fff3d8" opacity=".8"/>
      <circle cx="328" cy="-588" r="9" fill="#c9ccd2" stroke="#8d8e96" stroke-width="2"/>
      <circle cx="328" cy="-588" r="5" fill="#e9803a"/>
      <circle cx="326" cy="-590" r="1.6" fill="#fff" opacity=".85"/>
      <g id="eyes">
        <circle cx="276" cy="-562" r="14" fill="#3a3f48" stroke="#b8d36a" stroke-width="3"/>
        <circle cx="276" cy="-562" r="9" fill="url(#gLens)"/>
        <circle cx="272" cy="-566" r="2.4" fill="#fff" opacity=".8"/>
        <circle cx="322" cy="-562" r="14" fill="#3a3f48" stroke="#b8d36a" stroke-width="3"/>
        <circle cx="322" cy="-562" r="9" fill="url(#gLens)"/>
        <circle cx="318" cy="-566" r="2.4" fill="#fff" opacity=".8"/>
      </g>
    </g>

    <!-- sun glint on the head -->
    <g transform="translate(347 -606)"><g id="glintS">
      <polygon points="0,-13 2.5,-2.5 13,0 2.5,2.5 0,13 -2.5,2.5 -13,0 -2.5,-2.5" fill="#fffbe8"/>
    </g></g>

    <!-- robotic arm (stowed) -->
    <g id="arm">
      <path d="M482,-228 L548,-186" stroke="#7d7280" stroke-width="22" stroke-linecap="round" fill="none"/>
      <path d="M482,-228 L548,-186" stroke="#e0d6cd" stroke-width="14" stroke-linecap="round" fill="none"/>
      <circle cx="548" cy="-186" r="12" fill="#a39aa2"/><circle cx="548" cy="-186" r="6" fill="#6c6470"/>
      <path d="M548,-186 L604,-152" stroke="#7d7280" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M548,-186 L604,-152" stroke="#e0d6cd" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- turret -->
      <circle cx="616" cy="-146" r="38" fill="#8d8490"/>
      <circle cx="616" cy="-146" r="29" fill="#bbb2b9"/>
      <rect x="592" y="-186" width="30" height="34" rx="6" fill="#394764"/>
      <rect x="596" y="-190" width="22" height="8" rx="3" fill="url(#gGold)"/>
      <circle cx="640" cy="-164" r="13" fill="#cfd3da" stroke="#4b6fa8" stroke-width="4"/>
      <circle cx="640" cy="-164" r="5" fill="#1d2a44"/>
      <circle cx="644" cy="-132" r="8" fill="#2b2f37" stroke="#9aa3b0" stroke-width="2"/>
      <rect x="628" y="-150" width="34" height="16" rx="4" fill="#2a2d35"/>
      <rect x="660" y="-146" width="12" height="8" rx="2" fill="#8d8f96"/>
      <g fill="none" stroke="#f0b93b" stroke-width="3" stroke-linecap="round">
        <path d="M596,-124 C590,-106 610,-100 622,-110"/><path d="M604,-128 C600,-116 612,-112 618,-118"/>
      </g>
      <path d="M636,-182 A38,38 0 0 1 652,-150" fill="none" stroke="#ffe8c4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    </g>
  </g>

  <!-- SuperCam laser zap (flash only) -->
  <g id="laser" opacity="0">
    <line x1="332" y1="-584" x2="800" y2="-18" stroke="#ff9bd0" stroke-width="8" opacity=".3" stroke-linecap="round"/>
    <line x1="332" y1="-584" x2="800" y2="-18" stroke="#ffe3f1" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(800 -18)">
    <g id="sparkS">
      <circle r="24" fill="url(#gSpark)"/>
      <polygon points="0,-17 3.5,-3.5 17,0 3.5,3.5 0,17 -3.5,3.5 -17,0 -3.5,-3.5" fill="#fff7dc"/>
    </g>
    <circle id="ring" r="2" fill="none" stroke="#ffc98c" stroke-width="2" opacity="0"/>
  </g>
</g>

<path d="M1858,938 C1764,944 1704,974 1674,1004" fill="none" stroke="#ffc597" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
</svg>

<canvas id="dust"></canvas>
<div id="vig"></div>
<canvas id="grain" width="256" height="256"></canvas>

<script>
(function(){
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

/* ---------- tiny SMIL helpers ---------- */
function A(t, type, values, keyTimes, dur, o){
  o = o || {};
  const el = document.createElementNS(NS,'animateTransform');
  el.setAttribute('attributeName','transform');
  el.setAttribute('type',type);
  el.setAttribute('values',values.join(';'));
  if(keyTimes) el.setAttribute('keyTimes',keyTimes.join(';'));
  if(o.linear){ el.setAttribute('calcMode','linear'); }
  else { el.setAttribute('calcMode','spline');
         el.setAttribute('keySplines',Array(values.length-1).fill('.45 0 .55 1').join(';')); }
  el.setAttribute('dur',dur+'s');
  el.setAttribute('repeatCount','indefinite');
  if(o.begin) el.setAttribute('begin',o.begin);
  (typeof t==='string'?$(t):t).appendChild(el);
}
function F(t, attr, values, keyTimes, dur){
  const el = document.createElementNS(NS,'animate');
  el.setAttribute('attributeName',attr);
  el.setAttribute('values',values.join(';'));
  el.setAttribute('keyTimes',keyTimes.join(';'));
  el.setAttribute('calcMode','linear');
  el.setAttribute('dur',dur+'s');
  el.setAttribute('repeatCount','indefinite');
  (typeof t==='string'?$(t):t).appendChild(el);
}

/* ---------- rover idle timeline (16 s loop) ---------- */
const kt = [0,.12,.30,.44,.58,.66,.88,1];
A('eyes','translate',['0 0','-7 0','-7 0','0 0','0 0','8 0','8 0','0 0'],kt,16);
A('head','rotate',['0 302 -571','-2 302 -571','-2 302 -571','0 302 -571','0 302 -571','7 302 -571','7 302 -571','0 302 -571'],kt,16);
const kz = [0,.715,.72,.74,.76,1];
F('laser','opacity',[0,0,1,.3,0,0],kz,16);
A('sparkS','scale',[.001,.001,1.4,.4,.001,.001],kz,16,{linear:true});
F('ring','r',[2,2,24,30,30],[0,.72,.75,.78,1],16);
F('ring','opacity',[0,0,.9,0,0],[0,.72,.73,.78,1],16);

A('arm','rotate',['-1 482 -228','1.3 482 -228','-1 482 -228'],null,9);
A('hga','rotate',['-3 400 -395','3 400 -395','-3 400 -395'],null,7);
A('body','translate',['0 0','0 -1.6','0 0'],null,5.5);
F('led','opacity',[1,.15,1],[0,.5,1],2.4);
A('glintS','scale',[.001,1,.001],null,3.6,{begin:'1s'});

/* ---------- sky bits ---------- */
A('haloPulse','scale',[1,1.05,1],null,10);
A('cloud1','translate',['0 0','160 0','0 0'],null,110);
A('cloud2','translate',['0 0','-130 0','0 0'],null,140);
A('cloud3','translate',['0 0','-110 0','0 0'],null,125);
A('cloud4','translate',['0 0','150 0','0 0'],null,100);
A('phobos','translate',['-80 150','1000 80','2000 150'],null,170,{linear:true,begin:'-60s'});

/* ---------- seeded random ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry(11);

/* ---------- dust devil ---------- */
(function(){
  const g = $('devil'); const N = 12; let html='';
  for(let i=0;i<N;i++){
    const t=i/(N-1), y=708-t*160, rx=5+t*36, ry=3+t*7, op=(0.46*(1-t*0.62)).toFixed(2);
    html += `<ellipse id="dv${i}" cx="0" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="rgba(218,152,116,${op})"/>`;
  }
  g.innerHTML = html;
  for(let i=0;i<N;i++){
    const t=i/(N-1), a=3+t*24;
    A('dv'+i,'translate',[`${-a} 0`,`${a} 0`,`${-a} 0`],null,(2.8+t*1.2).toFixed(2),{begin:`-${(i*0.35).toFixed(2)}s`});
  }
  A('devilDrift','translate',['0 0','260 0','0 0'],null,170);
})();

/* ---------- ground: ripples, pebbles, rocks ---------- */
(function(){
  let r='';
  for(let i=0;i<80;i++){
    const y = 725 + 345*Math.pow(rnd(),1.5), s=(y-700)/380;
    const len = 40 + 300*s*(0.4+rnd()*0.8), x = rnd()*2000-40, h = 4+16*s;
    const w = (1+3*s).toFixed(1);
    r += `<path d="M${x.toFixed(0)},${y.toFixed(0)} q${(len/2).toFixed(0)},${-h.toFixed(0)} ${len.toFixed(0)},0" stroke="rgba(255,214,170,.14)" stroke-width="${w}"/>`;
    r += `<path d="M${x.toFixed(0)},${(y+2+5*s).toFixed(0)} q${(len/2).toFixed(0)},${-h.toFixed(0)} ${len.toFixed(0)},0" stroke="rgba(66,28,30,.22)" stroke-width="${w}"/>`;
  }
  $('ripples').innerHTML = r;

  let p='';
  for(let i=0;i<190;i++){
    const y = 722 + 350*Math.pow(rnd(),1.3), s=(y-700)/380, x=rnd()*1920, rr=(0.7+rnd()*1.8)*(0.5+s);
    if(x>600&&x<1240&&y>790&&y<945) continue;
    p += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rr.toFixed(1)}" fill="rgba(74,36,36,.5)"/><circle cx="${(x+rr*.5).toFixed(0)}" cy="${(y-rr*.5).toFixed(0)}" r="${(rr*.45).toFixed(1)}" fill="rgba(255,206,160,.5)"/>`;
  }
  $('pebbles').innerHTML = p;

  const cols=['#6a3d3a','#7a4a40','#5c3436','#70403a'];
  function rock(cx,cy,s,rg){
    const n=7, pts=[];
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+(rg()-.5)*.55, rr=s*(0.75+rg()*.4);
      pts.push([cx+Math.cos(a)*rr*1.25, cy+Math.sin(a)*rr*.72]);
    }
    const f=v=>v.toFixed(1), poly=a=>a.map(q=>f(q[0])+','+f(q[1])).join(' ');
    const top = pts.filter(q=>q[1]<=cy+s*.05);
    const hi  = pts.filter(q=>q[1]<=cy+s*.1 && q[0]>=cx-s*.2);
    let out = `<ellipse cx="${f(cx-s*1.1)}" cy="${f(cy+s*.38)}" rx="${f(s*1.9)}" ry="${f(s*.28)}" fill="rgba(46,18,30,.38)"/>`;
    out += `<polygon points="${poly(pts)}" fill="${cols[Math.floor(rg()*cols.length)]}"/>`;
    if(top.length>2) out += `<polygon points="${poly(top)}" fill="rgba(255,200,150,.2)"/>`;
    if(hi.length>1)  out += `<polyline points="${poly(hi)}" fill="none" stroke="rgba(255,216,170,.6)" stroke-width="${f(Math.max(1,s*.09))}" stroke-linecap="round" stroke-linejoin="round"/>`;
    return out;
  }
  let k='';
  for(let i=0;i<60;i++){
    const y = 728 + 340*Math.pow(rnd(),1.4), s=(5+rnd()*13)*(0.35+1.25*(y-720)/360), x=rnd()*1960-20;
    if(x>540&&x<1260&&y>770&&y<960) continue;
    k += rock(x,y,s,rnd);
  }
  $('rocks').innerHTML = k;
  $('heroRock').innerHTML = rock(1380,935,28,mulberry(5));
})();

/* ---------- film grain ---------- */
(function(){
  const c=$('grain'), x=c.getContext('2d'), im=x.createImageData(256,256), d=im.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  x.putImageData(im,0,0);
  c.style.width='100%'; c.style.height='100%'; c.style.imageRendering='auto';
  const url=c.toDataURL(); const div=document.createElement('div');
  div.id='grain2'; div.style.cssText='position:fixed;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background:url('+url+')';
  c.replaceWith(div);
})();

/* ---------- drifting dust (canvas) ---------- */
(function(){
  const cv=$('dust'), ctx=cv.getContext('2d'); let W=0,H=0,dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size(); addEventListener('resize',size);
  const sp=document.createElement('canvas'); sp.width=sp.height=64; const sc=sp.getContext('2d');
  const gr=sc.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(246,200,156,1)'); gr.addColorStop(1,'rgba(246,200,156,0)');
  sc.fillStyle=gr; sc.fillRect(0,0,64,64);
  const P=[], R=Math.random;
  for(let i=0;i<150;i++){const z=R();P.push({x:R()*W,y:H*(0.3+R()*0.7),z,r:0.7+z*2.3,vx:22+z*95,ph:R()*6.28,a:0.12+z*0.42,soft:false});}
  for(let i=0;i<16;i++){const z=R();P.push({x:R()*W,y:H*(0.45+R()*0.55),z,r:24+R()*46,vx:10+R()*30,ph:R()*6.28,a:0.03+R()*0.05,soft:true});}
  let last=performance.now(), t=0;
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
    const wind=Math.max(.3,1+.5*Math.sin(t*.31)+.25*Math.sin(t*.83+1));
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.x+=p.vx*wind*dt;
      if(p.x>W+70){p.x=-70;p.y=H*(0.3+R()*0.7);}
      const y=p.y+Math.sin(t*.8+p.ph)*(p.soft?10:6*p.z);
      if(p.soft){ctx.globalAlpha=p.a;ctx.drawImage(sp,p.x-p.r,y-p.r,p.r*2,p.r*2);}
      else{ctx.globalAlpha=p.a;ctx.fillStyle='#f6cba0';ctx.beginPath();ctx.arc(p.x,y,p.r,0,6.283);ctx.fill();}
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
})();
</script>
</body>
</html>
